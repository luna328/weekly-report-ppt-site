<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>每周工作周报 PPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@200;300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fafaf8;
      --ink: #0a0a0a;
      --accent: #002FA7;
      --accent-on: #ffffff;
      --grey-1: #f0f0ee;
      --grey-2: #d4d4d2;
      --grey-3: #737373;
      --sans: "Inter", "Helvetica Neue", "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --mono: "JetBrains Mono", "Consolas", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to right, rgba(10, 10, 10, .045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(10, 10, 10, .045) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 5.6vh 5vw 5vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 48px;
    }

    .chrome {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--grey-3);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(280px, .88fr);
      gap: 5vw;
      align-items: end;
      border-top: 1px solid var(--grey-2);
      padding-top: 5vh;
    }

    h1 {
      margin: 0;
      font-weight: 200;
      font-size: min(9.6vw, 16vh);
      line-height: .9;
      letter-spacing: -.045em;
    }

    .accent {
      color: var(--accent);
      font-style: italic;
      font-weight: 300;
    }

    .lead {
      max-width: 34em;
      margin: 0;
      color: #525252;
      font-size: clamp(18px, 1.45vw, 27px);
      line-height: 1.5;
      font-weight: 300;
    }

    .report-list {
      display: grid;
      gap: 0;
      align-self: start;
      border-top: 1px solid var(--ink);
    }

    .report {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr) auto;
      gap: 28px;
      align-items: center;
      min-height: 144px;
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--grey-2);
      padding: 24px 0;
      transition: background .18s ease, padding .18s ease;
    }

    .report:hover {
      background: var(--ink);
      color: var(--paper);
      padding-left: 24px;
      padding-right: 24px;
    }

    .report:hover p,
    .report:hover .meta {
      color: rgba(255, 255, 255, .72);
    }

    .week {
      font-weight: 200;
      font-size: min(5.8vw, 90px);
      line-height: .9;
      letter-spacing: -.04em;
      color: var(--accent);
      font-feature-settings: "tnum";
    }

    .report:hover .week {
      color: var(--accent-on);
    }

    h2 {
      margin: 0;
      font-size: clamp(28px, 3vw, 52px);
      line-height: 1.05;
      font-weight: 300;
      letter-spacing: -.035em;
    }

    p {
      margin: 10px 0 0;
      max-width: 720px;
      color: #525252;
      font-size: clamp(14px, 1vw, 18px);
      line-height: 1.65;
      font-weight: 300;
    }

    .tag,
    .meta {
      font-family: var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .tag {
      border: 1px solid currentColor;
      padding: 10px 14px;
      font-size: 12px;
      white-space: nowrap;
    }

    .meta {
      color: var(--grey-3);
      font-size: 11px;
      line-height: 1.7;
      text-align: right;
    }

    .block {
      position: fixed;
      right: 5vw;
      bottom: 5vh;
      width: min(24vw, 360px);
      height: min(28vh, 280px);
      background: var(--accent);
      opacity: .08;
      pointer-events: none;
      clip-path: polygon(20% 0, 100% 0, 100% 18%, 70% 18%, 70% 36%, 88% 36%, 88% 54%, 52% 54%, 52% 72%, 78% 72%, 78% 100%, 0 100%, 0 80%, 28% 80%, 28% 62%, 8% 62%, 8% 44%, 38% 44%, 38% 26%, 20% 26%);
    }

    @media (max-width: 800px) {
      .wrap {
        padding: 36px 20px;
      }

      .hero,
      .report {
        grid-template-columns: 1fr;
      }

      .meta {
        text-align: left;
      }

      .tag {
        width: max-content;
      }
    }
  </style>
</head>
<body>
  <div class="block" aria-hidden="true"></div>
  <div class="wrap">
    <div class="chrome">
      <div>Weekly Report Archive</div>
      <div>Guizang Swiss Edition</div>
    </div>

    <section class="hero">
      <h1>每周工作<br><span class="accent">周报 PPT</span></h1>
      <p class="lead">采购工作记录、交付风险、流程协作与阶段性复盘。每一周作为独立 HTML 演示稿归档。</p>
    </section>

    <main class="report-list">
      <a class="report" href="./reports/week-01/">
        <div class="week">01</div>
        <div>
          <h2>第一周工作周报</h2>
          <p>供应商及物料信息梳理、电机交期跟进、生产欠料回复、BOM 成本分析、线材事项、跨部门流程和 ERP 优化。</p>
        </div>
        <div class="tag">View Deck</div>
      </a>
    </main>

    <div class="meta">
      Netlify · GitHub · HTML Deck
    </div>
  </div>
</body>
</html>
