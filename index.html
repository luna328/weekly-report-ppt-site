<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>每周工作周报 PPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #F0EBDE;
      --ink: #1F2BE0;
      --ink-soft: #5560E5;
      --grid: rgba(31, 43, 224, .10);
      --line: rgba(31, 43, 224, .35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background: var(--paper);
      font-family: "Hanken Grotesk", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    .wrap {
      position: relative;
      width: min(1120px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 72px 0 64px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 42px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 32px;
      padding: 0 0 36px;
      border-bottom: 2px solid var(--ink);
    }

    .kicker,
    .meta,
    .tag {
      font-family: "DM Mono", Consolas, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .kicker {
      font-size: 13px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      max-width: 780px;
      font-family: "Newsreader", "STSong", serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(58px, 9vw, 120px);
      line-height: .92;
      letter-spacing: 0;
    }

    .meta {
      font-size: 12px;
      line-height: 1.9;
      text-align: right;
      white-space: nowrap;
    }

    main {
      align-self: start;
      display: grid;
      gap: 18px;
    }

    .report {
      display: grid;
      grid-template-columns: 104px 1fr auto;
      gap: 28px;
      align-items: center;
      min-height: 148px;
      padding: 26px 0;
      color: inherit;
      text-decoration: none;
      border-bottom: 1.5px solid var(--line);
      transition: background .18s ease, padding .18s ease;
    }

    .report:hover {
      background: rgba(31, 43, 224, .055);
      padding-left: 18px;
      padding-right: 18px;
    }

    .week {
      font-family: "Newsreader", Georgia, serif;
      font-style: italic;
      font-size: 64px;
      line-height: .9;
    }

    .report h2 {
      margin: 0;
      font-family: "Newsreader", "STSong", serif;
      font-style: italic;
      font-size: 38px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .report p {
      margin: 10px 0 0;
      max-width: 720px;
      font-size: 16px;
      line-height: 1.7;
    }

    .tag {
      padding: 9px 14px;
      border: 1.5px solid var(--ink);
      font-size: 12px;
      white-space: nowrap;
    }

    .pixel {
      position: fixed;
      right: 7vw;
      bottom: 9vh;
      width: 150px;
      height: 190px;
      opacity: .16;
      background:
        linear-gradient(var(--ink), var(--ink)) 40px 0 / 60px 28px no-repeat,
        linear-gradient(var(--ink), var(--ink)) 10px 28px / 95px 26px no-repeat,
        linear-gradient(var(--ink), var(--ink)) 34px 54px / 74px 24px no-repeat,
        linear-gradient(var(--ink), var(--ink)) 0 78px / 116px 28px no-repeat,
        linear-gradient(var(--ink), var(--ink)) 28px 106px / 82px 25px no-repeat,
        linear-gradient(var(--ink), var(--ink)) 8px 131px / 108px 30px no-repeat,
        linear-gradient(var(--ink), var(--ink)) 36px 161px / 76px 29px no-repeat;
      pointer-events: none;
    }

    @media (max-width: 760px) {
      .wrap {
        width: min(100% - 28px, 1120px);
        padding-top: 44px;
      }

      header,
      .report {
        grid-template-columns: 1fr;
      }

      .meta {
        text-align: left;
        white-space: normal;
      }

      .tag {
        width: max-content;
      }
    }
  </style>
</head>
<body>
  <div class="pixel" aria-hidden="true"></div>
  <div class="wrap">
    <header>
      <div>
        <div class="kicker">Weekly Report Archive</div>
        <h1>每周工作周报 PPT</h1>
      </div>
      <div class="meta">
        Procurement Notes<br />
        Cobalt Grid Edition
      </div>
    </header>

    <main>
      <a class="report" href="./reports/week-01/">
        <div class="week">01</div>
        <div>
          <h2>第一周工作周报</h2>
          <p>供应商及物料信息梳理、电机交期跟进、生产欠料回复、BOM 成本分析、线材事项、跨部门流程和 ERP 优化。</p>
        </div>
        <div class="tag">View Deck</div>
      </a>
    </main>
  </div>
</body>
</html>
